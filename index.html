<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaChat — AI Messenger</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Animated Background -->
    <div class="background">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="orb orb-three"></div>
    </div>

    <main class="app">

        <!-- =========================
             SIDEBAR
        ========================== -->
        <aside class="sidebar">

            <div class="brand">
                <div class="brand-icon">
                    ✦
                </div>

                <div>
                    <h1>NovaChat</h1>
                    <span>Smart conversations</span>
                </div>
            </div>

            <div class="sidebar-section">
                <p class="section-label">Your Assistant</p>

                <div class="assistant-card">
                    <div class="assistant-avatar">
                        🤖
                        <span class="online-dot"></span>
                    </div>

                    <div class="assistant-info">
                        <strong>Nova AI</strong>
                        <span>Always online</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-tip">
                <div class="tip-icon">💡</div>

                <div>
                    <strong>Try saying</strong>
                    <p>"Tell me a joke"</p>
                </div>
            </div>

            <button class="clear-btn" id="clearChat">
                <span>⌫</span>
                Clear conversation
            </button>

            <div class="sidebar-footer">
                <span>Frontend Project</span>
                <span>•</span>
                <span>Local Storage</span>
            </div>

        </aside>


        <!-- =========================
             CHAT AREA
        ========================== -->
        <section class="chat-container">

            <!-- Header -->
            <header class="chat-header">

                <div class="profile">

                    <div class="avatar">
                        🤖
                        <span class="avatar-status"></span>
                    </div>

                    <div class="profile-text">
                        <h2>Nova AI</h2>

                        <div class="status">
                            <span class="status-dot"></span>
                            Online
                        </div>
                    </div>

                </div>

                <div class="header-actions">
                    <button class="icon-btn" title="Search">
                        ⌕
                    </button>

                    <button class="icon-btn" title="More">
                        ⋮
                    </button>
                </div>

            </header>


            <!-- Chat Messages -->
            <div class="chat-box" id="chatBox">

                <!-- Empty state -->
                <div class="welcome-message" id="welcomeMessage">

                    <div class="welcome-icon">
                        ✨
                    </div>

                    <h3>Welcome to NovaChat</h3>

                    <p>
                        Start a conversation with your AI assistant.
                        Your messages are saved automatically.
                    </p>

                    <div class="suggestions">

                        <button class="suggestion">
                            👋 Say hello
                        </button>

                        <button class="suggestion">
                            😂 Tell me a joke
                        </button>

                        <button class="suggestion">
                            💡 Give me an idea
                        </button>

                    </div>

                </div>

            </div>


            <!-- Typing Indicator -->
            <div class="typing-wrapper" id="typingWrapper">

                <div class="typing-avatar">
                    🤖
                </div>

                <div class="typing-indicator">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>


            <!-- Input Area -->
            <div class="input-area">

                <div class="input-wrapper">

                    <button class="attachment-btn" title="Attachment">
                        +
                    </button>

                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Write a message..."
                        autocomplete="off"
                        maxlength="500"
                    >

                    <span class="char-count" id="charCount">
                        0/500
                    </span>

                    <button
                        class="send-btn"
                        id="sendButton"
                        aria-label="Send message"
                    >
                        <span>➤</span>
                    </button>

                </div>

                <p class="input-hint">
                    Press <kbd>Enter</kbd> to send
                </p>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
